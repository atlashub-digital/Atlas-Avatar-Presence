<text x="54" y="58" font-size="31" font-weight="bold" font-family="Arial,sans-serif" fill="#f1f7ff">ATLAS AVATAR PRESENCE</text>
<text x="55" y="91" font-size="16" font-family="Arial,sans-serif" fill="#9cc7de">Visual personality · Voice ownership · Agent portability · v0.1.0</text>
