<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="title desc">
<title id="title">Atlas Avatar Presence architecture</title><desc id="desc">The Avatar UI connects to a neutral session controller; Hermes is the default agent and voice owner. Optional OpenClaw and a mock agent can be selected. Knowledge Hub and Device Bridge remain separate services.</desc>
